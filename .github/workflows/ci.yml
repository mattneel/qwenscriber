name: ci

# CI is the authority for every distributable artifact (ADR-0004). It runs the
# same gates a developer runs locally, so a green build here means the commands
# in docs/src/getting-started and docs/src/development passed on a clean
# checkout rather than on one machine's warm cache.
#
# The GPU conformance harness is deliberately absent: it needs a real WebGPU
# adapter, and a runner without one would either skip silently or fail for
# reasons unrelated to the change. Run it with `node tests/gpu/driver.mjs` on a
# machine that has one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    # Debug is where assertions fire; ReleaseSafe keeps the safety checks with
    # optimizations on; ReleaseFast is what ships. The three do not find the same
    # bugs — an uninitialized read can pass in one and trap in another — so the
    # gate runs all of them rather than trusting the cheapest configuration.
    name: Zig gate (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in the build reads git metadata, but a shallow checkout
          # keeps the job fast and the artifact deterministic.
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        # No `version`: the action installs `minimum_zig_version` from build.zig.zon, the revision
        # this code was written against. Following `master` instead hands the format check and the
        # standard library whatever was released overnight, so the gate fails on a compiler nobody
        # chose -- which is what happened once master moved thirteen revisions past the pin.
      - name: Report toolchain
        run: zig version
      - name: Format check, unit tests, reference comparisons, WASM ABI
        run: zig build check -Doptimize=${{ matrix.optimize }}
      - name: Build the freestanding module
        run: zig build wasm

  shaders:
    name: Shader and quantization layout drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fail if the WGSL mirrors stop matching src/core
        run: node tests/gpu/layout_drift.mjs

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: mlugg/setup-zig@v2
        # As in the Zig gate: the revision comes from build.zig.zon, not from `master`.
      - name: Build the WASM module the package embeds
        run: zig build wasm
      - name: Build, typecheck, and test
        working-directory: packages/qwenscriber
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run typecheck
          npm test

  book:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build the mdBook
        run: mdbook build docs
      - name: Upload the rendered book
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book
          if-no-files-found: error

  pages:
    name: Publish the book to GitHub Pages
    # Publication is part of the pipeline (docs/src/development/releases.md step
    # 10): deploy the book CI already built and validated, from the default
    # branch only. Pull requests still get the artifact above for inspection.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@v4
